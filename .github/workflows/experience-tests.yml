name: Experience regression tests
on:
  push:
    branches: [codex/v5.25-cloud-validation]
  pull_request:
    branches: [claude/v5.21-interface]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- index.html
      - run: npm test
      - run: node tools/render-score.cjs /tmp/nebuleuse-extrait.wav
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/photo17.cjs .
      - run: node tests/e2e/phenomena16.cjs .
      - run: node tests/e2e/routes15.cjs .
      - run: node tests/e2e/smoke13.cjs .
